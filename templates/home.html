<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Invest - Home</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* Container for the menu button */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0.5rem 0;
            z-index: 1001; /* Ensure button is above the overlay */
        }

        /* Hamburger menu button styling */
        .menu-button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            width: 44px;
            height: 44px;
            margin-left: 1.5rem;
            box-sizing: border-box;
        }

        .menu-button span {
            width: 100%;
            height: 3px;
            background-color: white;
            border-radius: 2px;
            transition: all 0.3s ease-in-out;
        }
        
        /* Sidebar styling */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 280px; /* Width of the sidebar */
            background-color: #2c2c2c;
            border-right: 1px solid #444;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.5);
            padding-top: 5rem; /* Space at the top */
            transform: translateX(-100%); /* Hidden by default */
            transition: transform 0.3s ease-in-out;
            z-index: 1000;
        }

        .sidebar.active {
            transform: translateX(0); /* Slides the sidebar into view */
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .sidebar a {
            display: block;
            padding: 1rem 1.5rem;
            color: #e0e0e0;
            text-decoration: none;
            font-size: 1.1rem;
            border-bottom: 1px solid #383838;
            transition: background-color 0.2s;
        }

        .sidebar a:hover {
            background-color: #444;
        }

        /* Overlay for the main content when menu is open */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 999; /* Below the sidebar but above the content */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        /* Main content container */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        /* Bouncing text styling */
        .bouncing-text {
            font-size: 8rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.4),
                         0 0 15px rgba(0, 255, 255, 0.25),
                         0 0 20px rgba(0, 255, 255, 0.15);
            animation: bounce 2s infinite alternate ease-in-out;
        }

        /* Keyframes for bouncing animation */
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="menu-button" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

    <nav class="sidebar" id="mainSidebar">
        <ul>
            <li><a href="/widget_two">Call Options Widget</a></li>
            </ul>
    </nav>
    
    <div class="overlay" id="overlay"></div>

    <div class="main-content">
        <div class="bouncing-text">Trade Invest</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.getElementById('menuToggle');
            const mainSidebar = document.getElementById('mainSidebar');
            const overlay = document.getElementById('overlay');

            function toggleMenu() {
                mainSidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            }

            // Open/close menu on button click
            menuToggle.addEventListener('click', toggleMenu);

            // Close menu when clicking on the overlay
            overlay.addEventListener('click', toggleMenu);
        });
    </script>

</body>
</html>
