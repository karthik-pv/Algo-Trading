<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Trading Dashboard (SSE)</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }
      .container {
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 8px;
        width: 400px;
      }
      h2 {
        margin-top: 0;
      }
      #alerts {
        list-style-type: none;
        padding: 0;
      }
      #alerts li {
        padding: 10px;
        margin-bottom: 8px;
        border-radius: 5px;
        border: 1px solid #ddd;
      }
      /* Simple style for the new button */
      #refresh-btn {
        margin-top: 10px;
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 5px;
        border: 1px solid #aaa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Trade Alerts</h2>
      <button id="refresh-btn">Refresh Subscriptions</button>
      <ul id="alerts"></ul>
    </div>

    <script>
      const colorMap = {
        red: "rgba(255, 102, 102, 0.2)",
        green: "rgba(102, 255, 102, 0.2)",
        blue: "rgba(102, 102, 255, 0.2)",
        default: "rgba(200, 200, 200, 0.2)",
      };

      // --- SSE Logic (Unchanged) ---
      const eventSource = new EventSource("/stream");
      console.log("Connecting to SSE stream...");

      eventSource.onmessage = (event) => {
        const data = JSON.parse(event.data);
        console.log("Received alert:", data);
        const alertsList = document.getElementById("alerts");
        const newAlert = document.createElement("li");
        newAlert.textContent = `[${new Date().toLocaleTimeString()}] ${
          data.msg
        }`;
        newAlert.style.backgroundColor =
          colorMap[data.color] || colorMap.default;
        alertsList.prepend(newAlert);
        if (alertsList.children.length > 5) {
          alertsList.removeChild(alertsList.lastElementChild);
        }
      };
      eventSource.onerror = (err) => {
        console.error("EventSource failed:", err);
      };

      // --- NEW: Button Click Logic ---
      const refreshButton = document.getElementById("refresh-btn");

      refreshButton.addEventListener("click", () => {
        console.log("Refresh button clicked. Sending request...");

        // Use the fetch API to send a GET request to the server
        fetch("/refresh_ticker_subscriptions")
          .then((response) => {
            if (response.ok) {
              console.log("Successfully triggered subscription refresh.");
              // Optionally provide feedback to the user
              refreshButton.textContent = "Refreshed!";
              setTimeout(() => {
                refreshButton.textContent = "Refresh Subscriptions";
              }, 2000); // Reset text after 2 seconds
            } else {
              console.error("Failed to trigger refresh.");
            }
          })
          .catch((error) => {
            console.error("Error during fetch:", error);
          });
      });
    </script>
  </body>
</html>
