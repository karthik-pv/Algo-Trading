<div class="widget-container" id="sell-widget-container">
    <h2>Sell Positions</h2>
     <!-- Status + Refresh button on same line -->
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
        <p style="margin:0;">
            Status: <strong id="sellConnectionStatus" style="color: #ffc107;">Connecting...</strong>
        </p>

        <!-- Refresh button (right aligned) -->
        <button class="toggle-button" id="refreshSellBtn"
                title="Refresh Positions"
                style="font-size:1.1rem; padding:0.5rem 0.7rem;">
            &#x21bb;
        </button>
    </div>
    <table class="option-table">
        <thead>
            <tr>
                <th class="center">Action</th>
                <th>P/L</th>
                <th>%</th>
                <th>PTS</th>
                <th>Levels</th>
                <th>XE</th>
                <th>SPrice</th>
                <th>BPrice</th>
                <th>MPrice</th>
                <th>Lots</th>
                <th>Lots(O)</th>
                <th>Type</th>
                <th>Sell Type</th>
            </tr>
        </thead>
        <tbody id="positionsTableBody">
            <tr><td colspan="14" class="no-options">Loading open positions...</td></tr>
        </tbody>
    </table>
</div>
