{% extends "base.html" %}

{% block title %}Orders{% endblock %}

{% block head_styles %}
<style>
    /* --- GENERAL LAYOUT --- */
    .main-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1rem 0.25rem 1.5rem;
        gap: 16px;
        box-sizing: border-box;
    }

    /* --- SHARED PILL STYLES (used by the cash summary label) --- */
    .toggle-buttons {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .expiry-label {
        color: white;
        min-width: auto;
        white-space: nowrap;
        flex: 0 0 auto;
        font-size: 0.8rem;
        vertical-align: middle;
    }
    .toggle-buttons .expiry-label {
        background-color: hsl(0, 1%, 26%);
        padding: 5px 10px;
        border-radius: 4px;
        border: 1px solid #c8c8c8;
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
    }
    .no-options { text-align: center; color: #888; margin: 0; padding: 6px; border: 1px dashed #555; border-radius: 8px; background-color: #333; }

    /* --- ORDERS GRID (current day executed trades) --- */
    #ordersGridWrapper {
        width: 100%;
        max-width: none;
    }

    .orders-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
    }

    .cash-summary {
        gap: 8px;
    }

    .cash-summary .cash-caption {
        color: #aaa;
        font-weight: 500;
    }

    #cashBeginValue {
        color: #9e9e9e;
        font-weight: 600;
    }

    .cash-summary .cash-arrow {
        color: #757575;
        font-size: 0.8rem;
    }

    #cashCurrentValue {
        color: #fff;
        font-weight: 700;
    }

    #cashChangePct {
        margin-left: 4px;
        padding: 2px 8px;
        border-radius: 5px;
        border: 1px solid #555;
        color: #aaa;
        font-weight: 700;
        font-size: 0.72rem;
    }

    #cashChangePct.profit {
        color: #66bb6a;
        background: rgba(102, 187, 106, 0.12);
        border-color: rgba(102, 187, 106, 0.45);
    }

    #cashChangePct.loss {
        color: #ef5350;
        background: rgba(239, 83, 80, 0.12);
        border-color: rgba(239, 83, 80, 0.45);
    }

    .orders-header-right {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    #ordersCountLabel {
        font-size: 0.78rem;
        color: #aaa;
    }

    #ordersRefreshBtn, #ordersDownloadBtn, #ordersUploadBtn {
        background: transparent;
        color: #ccc;
        border: 1px solid #666;
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
        font-size: 1rem;
        line-height: 1.2;
    }

    #ordersDownloadBtn, #ordersUploadBtn { font-size: 0.78rem; font-weight: 600; }

    #ordersRefreshBtn:hover, #ordersDownloadBtn:hover, #ordersUploadBtn:hover { background: #444; color: #fff; }

    #ordersRefreshBtn:disabled, #ordersDownloadBtn:disabled, #ordersUploadBtn:disabled {
        color: #666;
        cursor: not-allowed;
        background: transparent;
    }

    #ordersDateInput {
        background: transparent;
        color: #ccc;
        border: 1px solid #666;
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
        color-scheme: dark;
    }

    #ordersDateInput:focus {
        outline: none;
        border-color: #888;
        color: #fff;
    }

    #ordersGridContainer {
        max-height: 420px;
        overflow: auto;
        border: 1px solid #444;
        border-radius: 8px;
        background: #1f1f1f;
        padding: 10px;
        box-sizing: border-box;
    }

    #ordersTable {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.75rem;
        color: #ddd;
    }

    #ordersTable th, #ordersTable td {
        border: 1px solid #444;
        padding: 4px 5px;
        text-align: center;
        vertical-align: middle;
        white-space: nowrap;
    }

    #ordersTable thead th {
        background-color: #383838;
        font-weight: 600;
        color: #ccc;
        position: sticky;
        top: 0;
        z-index: 2;
    }

    #ordersTable tbody tr:nth-child(even) { background: #262626; }
    #ordersTable tbody tr:hover { background: #333; }
    #ordersTable td:nth-child(4) { text-align: left; }

    #ordersTable tr.trade-buy td:nth-child(3) {
        background: #1c3a5e;
        color: #64b5f6;
        font-weight: 700;
    }

    #ordersTable tr.trade-sell td:nth-child(3) {
        background: #5e1c1c;
        color: #ef9a9a;
        font-weight: 700;
    }

    #ordersTable td.type-ce {
        background: #1c3a5e;
        color: #64b5f6;
        font-weight: 700;
    }

    #ordersTable td.type-pe {
        background: #5e1c1c;
        color: #ef9a9a;
        font-weight: 700;
    }

    #ordersTable thead th[data-sort-key] { cursor: pointer; user-select: none; }
    #ordersTable thead th[data-sort-key]:hover { background: #4a4a4a; color: #fff; }
    #ordersTable thead th.sort-active { background-color: #2e2e2e; color: #fff; }
    #ordersTable thead th.sort-active::after { content: '\25B2'; font-size: 0.7em; margin-left: 3px; }
    #ordersTable thead th.sort-active.sort-desc::after { content: '\25BC'; }

    #ordersTable .pnl-dark-green { background: #00B050 !important; color: #fff; font-weight: 700; }
    #ordersTable .pnl-light-green { background: #92D050 !important; color: #006100; font-weight: 700; }
    #ordersTable .pnl-pale-green { background: #1b4d1f !important; color: #97d49a; }
    #ordersTable .pnl-dark-red { background: #d32f2f !important; color: #fff; font-weight: 700; }
    #ordersTable .pnl-light-red { background: #ff8a80 !important; color: #9C0006; font-weight: 700; }
    #ordersTable .pnl-pale-red { background: #4d1b1b !important; color: #d49a9a; }
</style>
{% endblock %}

{% block content %}
<main class="main-content">

    <!-- === ORDERS GRID (executed trades for the selected date) === -->
    <div id="ordersGridWrapper">
        <div class="orders-header">
            <div class="toggle-buttons">
                <label id="cashSummaryLabel" class="expiry-label cash-summary" style="display: none;" title="Cash: start of day &#8594; current, with day change %">
                    <!-- <span class="cash-caption">Cash</span>
                    <span id="cashBeginValue">--</span>
                    <span class="cash-arrow">&#8594;</span>
                    <span id="cashCurrentValue">--</span>
                    <span id="cashChangePct">--</span> -->
                    <span class="cash-caption">Day Start</span>
                    <span id="cashBeginValue">--</span>
                    <span class="cash-arrow">&#8594;</span>
                    <span class="cash-caption">Net P/L</span>
                    <span id="cashCurrentValue">--</span>
                    <span id="cashChangePct">--</span>                    
                </label>
            </div>
            <div class="orders-header-right">
                <input type="date" id="ordersDateInput" title="Trade date to load in this grid">
                <span id="ordersCountLabel"></span>
                <button id="ordersUploadBtn" type="button" title="Upload an M.Stock contract note PDF into this grid">&#8679; Upload</button>
                <button id="ordersDownloadBtn" type="button" title="Download the trades shown in this grid as Excel">&#8681; Download</button>
                <button id="ordersRefreshBtn" type="button" title="Refresh trades for the selected date">&#x21bb;</button>
                <input type="file" id="ordersUploadInput" accept="application/pdf" style="display: none;">
            </div>
        </div>
        <div id="ordersGridContainer">
            <table id="ordersTable">
                <thead>
                    <tr>
                        <th data-sort-key="ORDERDATE">OrderDate</th>
                        <th data-sort-key="ORDERTIME">OrderTime</th>
                        <th data-sort-key="TRAN">Tran</th>
                        <th data-sort-key="CONT">Cont</th>
                        <th data-sort-key="Type">Type</th>
                        <th data-sort-key="Qty.">Qty.</th>
                        <th data-sort-key="RATE">Rate</th>
                        <th data-sort-key="Duration">Duration</th>
                        <th data-sort-key="PurValue">PurValue</th>
                        <th data-sort-key="PnL_Rate">PnL_Rate</th>
                        <th data-sort-key="PnL">PnL</th>
                        <th data-sort-key="PnL%">PnL%</th>
                        <th data-sort-key="PnL_RT">PnL_RT</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr><td colspan="13" class="no-options">No trades for the selected date.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('ORDERS PAGE JS: DOMContentLoaded', new Date().toISOString());

    // --- SOCKET CONNECTION ---
    // This page keeps its own Socket.IO connection so the grid refreshes
    // automatically right after an order is placed from the Trade page.
    // Websocket-only transport: skips the polling-then-upgrade handshake.
    const socket = io('http://localhost:5001', { transports: ['websocket'] });

    // --- DOM ELEMENTS ---
    const ordersTableBody = document.getElementById('ordersTableBody');
    const ordersCountLabel = document.getElementById('ordersCountLabel');
    const ordersRefreshBtn = document.getElementById('ordersRefreshBtn');
    const ordersDownloadBtn = document.getElementById('ordersDownloadBtn');
    const ordersUploadBtn = document.getElementById('ordersUploadBtn');
    const ordersUploadInput = document.getElementById('ordersUploadInput');
    const ordersDateInput = document.getElementById('ordersDateInput');
    const cashSummaryLabel = document.getElementById('cashSummaryLabel');

    // --- STATE VARIABLES ---
    let ordersRowsCache = [];
    let ordersSort = { key: null, direction: 1 };
    // Grid data source: 'broker' (live trades for the selected date) or
    // 'upload' (contract-note rows). Refresh / date change resets this.
    let ordersSource = 'broker';
    let uploadedOrdersMeta = null;
    let ordersRefreshTimer = null;

    // --- ORDERS GRID: current day executed trades ---
    function getTodayTradeDate() {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    function getSelectedTradeDate() {
        return (ordersDateInput && ordersDateInput.value) || getTodayTradeDate();
    }

    // Default the date picker to today once.
    if (ordersDateInput && !ordersDateInput.value) {
        ordersDateInput.value = getTodayTradeDate();
    }

    async function loadOrders() {
        if (!ordersTableBody) return;
        // Loading broker data resets any uploaded contract-note view.
        ordersSource = 'broker';
        uploadedOrdersMeta = null;
        if (ordersRefreshBtn) ordersRefreshBtn.disabled = true;
        const tradeDate = getSelectedTradeDate();
        const isToday = tradeDate === getTodayTradeDate();
        try {
            const tradesPromise = fetch('/get_executed_trades', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ trade_date: tradeDate })
            });
            /*
            const fundPromise = fetch('/fund_summary')
                .then(response => response.json())
                .catch(() => null);
            */
            const dayCashPromise = fetch('/day_cash')
                .then(response => response.json())
                .catch(() => null);

            const response = await tradesPromise;
            const data = await response.json();
            if (!response.ok || !data.success) {
                throw new Error(data.error || `HTTP Error: ${response.status}`);
            }
            /*    
            const fundData = await fundPromise;
            const currentCash = parseFloat(
                fundData && fundData.data && fundData.data.cash_balance
            );
            */

            const dayCashData = await dayCashPromise;
            const dayStartCash = (dayCashData && dayCashData.success)
                ? parseFloat(dayCashData.cash_balance)
                : NaN;

            ordersRowsCache = data.rows || [];
            // Show the cash summary box only for today's view (live cash
            // start-of-day values are meaningless for a past date) and
            // only when there are trades to display.
            if (cashSummaryLabel) {
                cashSummaryLabel.style.display =
                    (ordersRowsCache.length > 0 && isToday) ? '' : 'none';
            }
            renderOrders(ordersRowsCache);
            //renderOrdersCashSummary(currentCash, dayStartCash);
            renderOrdersCashSummary(dayStartCash);
        } catch (error) {
            console.error("Could not load trades:", error);
            ordersTableBody.innerHTML = `<tr><td colspan="13" class="no-options">Failed to load trades: ${error.message || 'Unknown error'}</td></tr>`;
            if (ordersCountLabel) ordersCountLabel.textContent = '';
            if (cashSummaryLabel) cashSummaryLabel.style.display = 'none';
        } finally {
            if (ordersRefreshBtn) ordersRefreshBtn.disabled = false;
        }
    }

    function formatInstrumentDisplay(value) {
        const symbol = String(value || '').toUpperCase();
        if (!symbol) return '';

        let prefix = '';
        if (symbol.startsWith('CRUDEOILM')) prefix = 'CM';
        else if (symbol.startsWith('CRUDEOIL')) prefix = 'C';
        else if (symbol.startsWith('NIFTY')) prefix = 'N';
        else if (symbol.startsWith('SENSEX')) prefix = 'S';
        else return symbol;

        const match = symbol.match(/(\d{4,5})(?=CE|PE$)/);
        if (!match) return symbol;

        return `${prefix} ${match[1]}`;
    }

    const ORDERS_NUMERIC_SORT_COLUMNS = ['ORDERDATE', 'Qty.', 'RATE', 'Duration', 'PurValue', 'PnL_Rate', 'PnL', 'PnL%', 'PnL_RT'];

    function getOrdersSortValue(row, column) {
        if (column === 'Type') {
            const contractSymbol = String(row['CONT'] || '').toUpperCase();
            const typeMatch = contractSymbol.match(/(CE|PE)$/);
            return typeMatch ? typeMatch[1] : '';
        }
        const raw = row[column];
        if (raw === null || raw === undefined) return '';
        if (column === 'ORDERDATE') {
            const parts = String(raw).split('/');
            if (parts.length !== 3) return '';
            const parsed = Date.UTC(Number(parts[2]), Number(parts[0]) - 1, Number(parts[1]));
            return Number.isNaN(parsed) ? '' : parsed;
        }
        if (column === 'Duration') {
            const parts = String(raw).split(':');
            if (parts.length !== 2) return '';
            const seconds = Number(parts[0]) * 60 + Number(parts[1]);
            return Number.isNaN(seconds) ? '' : seconds;
        }
        if (column === 'PurValue') {
            const parsed = parseFloat(String(raw));
            return Number.isNaN(parsed) ? '' : parsed;
        }
        if (column === 'Qty.') return String(raw).split('/')[0];
        return raw;
    }

    function sortOrdersRows(rows) {
        if (!ordersSort.key || !rows || rows.length === 0) return rows || [];
        const numeric = ORDERS_NUMERIC_SORT_COLUMNS.includes(ordersSort.key);
        const direction = ordersSort.direction;
        return [...rows].sort((a, b) => {
            const av = getOrdersSortValue(a, ordersSort.key);
            const bv = getOrdersSortValue(b, ordersSort.key);
            const aEmpty = av === '' || (numeric && Number.isNaN(Number(av)));
            const bEmpty = bv === '' || (numeric && Number.isNaN(Number(bv)));
            if (aEmpty && bEmpty) return 0;
            if (aEmpty) return 1;
            if (bEmpty) return -1;
            if (numeric) return (Number(av) - Number(bv)) * direction;
            return String(av).localeCompare(String(bv), undefined, { sensitivity: 'base', numeric: true }) * direction;
        });
    }

    function updateOrdersSortIndicators() {
        document.querySelectorAll('#ordersTable thead th[data-sort-key]').forEach(th => {
            const isActive = ordersSort.key === th.getAttribute('data-sort-key');
            th.classList.toggle('sort-active', isActive);
            th.classList.toggle('sort-desc', isActive && ordersSort.direction === -1);
        });
    }

    function attachOrdersSortHandlers() {
        document.querySelectorAll('#ordersTable thead th[data-sort-key]').forEach(th => {
            th.addEventListener('click', () => {
                const key = th.getAttribute('data-sort-key');
                if (ordersSort.key === key) {
                    ordersSort.direction = -ordersSort.direction;
                } else {
                    ordersSort.key = key;
                    ordersSort.direction = 1;
                }
                renderOrders(ordersRowsCache);
            });
        });
    }

    function renderOrders(rows) {
        ordersTableBody.innerHTML = '';
        updateOrdersSortIndicators();

        if (!rows || rows.length === 0) {
            ordersTableBody.innerHTML = `<tr><td colspan="13" class="no-options">No trades for the selected date.</td></tr>`;
            if (ordersCountLabel) ordersCountLabel.textContent = '';
            return;
        }

        const columns = [
            'ORDERDATE', 'ORDERTIME', 'TRAN', 'CONT', 'Type', 'Qty.', 'RATE',
            'Duration', 'PurValue', 'PnL_Rate', 'PnL', 'PnL%', 'PnL_RT'
        ];

        sortOrdersRows(rows).forEach(row => {
            const tr = document.createElement('tr');

            const transaction = String(row['TRAN'] || '').toUpperCase();
            if (transaction === 'BUY') tr.classList.add('trade-buy');
            else if (transaction === 'SELL') tr.classList.add('trade-sell');

            columns.forEach(column => {
                const td = document.createElement('td');
                const value = row[column];
                let displayValue = (value === null || value === undefined) ? '' : value;
                if (column === 'Qty.' && displayValue !== '') {
                    displayValue = String(displayValue).split('/')[0];
                }
                if (column === 'CONT' && displayValue !== '') {
                    displayValue = formatInstrumentDisplay(displayValue);
                }
                if (column === 'Type') {
                    const contractSymbol = String(row['CONT'] || '').toUpperCase();
                    const typeMatch = contractSymbol.match(/(CE|PE)$/);
                    displayValue = typeMatch ? typeMatch[1] : '';
                    if (displayValue === 'CE') td.classList.add('type-ce');
                    else if (displayValue === 'PE') td.classList.add('type-pe');
                }
                if (column === 'PnL' || column === 'PnL_RT') {
                    const pnlValue = Number(value);
                    if (value !== '' && value !== null && value !== undefined && !Number.isNaN(pnlValue)) {
                        displayValue = pnlValue.toLocaleString('en-IN');
                    }
                }
                if (column === 'PnL_Rate') {
                    const pnlRateValue = Number(value);
                    if (value !== '' && value !== null && value !== undefined && !Number.isNaN(pnlRateValue)) {
                        displayValue = pnlRateValue.toFixed(2);
                    }
                }
                if (column === 'PnL%') {
                    const pnlPercent = Number(value);
                    if (value !== '' && value !== null && value !== undefined && !Number.isNaN(pnlPercent)) {
                        displayValue = pnlPercent.toFixed(1);
                    }
                }
                td.textContent = displayValue;

                if (column === 'PnL%') {
                    const pnlPercent = Number(value);
                    if (value !== '' && value !== null && value !== undefined && !Number.isNaN(pnlPercent)) {
                        if (pnlPercent > 10) td.classList.add('pnl-dark-green');
                        else if (pnlPercent > 5) td.classList.add('pnl-light-green');
                        else if (pnlPercent > 0) td.classList.add('pnl-pale-green');
                        else if (pnlPercent < -10) td.classList.add('pnl-dark-red');
                        else if (pnlPercent < -5) td.classList.add('pnl-light-red');
                        else if (pnlPercent < 0) td.classList.add('pnl-pale-red');
                    }
                }

                tr.appendChild(td);
            });

            ordersTableBody.appendChild(tr);
        });

        if (ordersCountLabel) {
            const sourceSuffix = ordersSource === 'upload'
                ? ` · Contract Note${uploadedOrdersMeta && uploadedOrdersMeta.trade_date ? ' ' + uploadedOrdersMeta.trade_date : ''}`
                : '';
            ordersCountLabel.textContent = `${rows.length} trade${rows.length === 1 ? '' : 's'}${sourceSuffix}`;
        }
    }

    // function renderOrdersCashSummary(currentCash, dayStartCash) {
    //     const cashBeginEl = document.getElementById('cashBeginValue');
    //     const cashCurrentEl = document.getElementById('cashCurrentValue');
    //     const cashChangeEl = document.getElementById('cashChangePct');
    //     if (!cashBeginEl || !cashCurrentEl || !cashChangeEl) return;

    //     cashBeginEl.textContent = Number.isFinite(dayStartCash)
    //         ? dayStartCash.toLocaleString('en-IN', { maximumFractionDigits: 0 })
    //         : '--';
    //     cashCurrentEl.textContent = Number.isFinite(currentCash)
    //         ? currentCash.toLocaleString('en-IN', { maximumFractionDigits: 0 })
    //         : '--';

    //     if (Number.isFinite(currentCash) && Number.isFinite(dayStartCash) && dayStartCash > 0) {
    //         const changePct = ((currentCash - dayStartCash) / dayStartCash) * 100;
    //         cashChangeEl.textContent = `${changePct.toFixed(2)}%`;
    //         cashChangeEl.className = changePct > 0 ? 'profit' : (changePct < 0 ? 'loss' : '');
    //     } else {
    //         cashChangeEl.textContent = '--';
    //         cashChangeEl.className = '';
    //     }
    // }

    function renderOrdersCashSummary(dayStartCash) {
        const cashBeginEl = document.getElementById('cashBeginValue');
        const cashCurrentEl = document.getElementById('cashCurrentValue');
        const cashChangeEl = document.getElementById('cashChangePct');

        if (!cashBeginEl || !cashCurrentEl || !cashChangeEl) return;

        cashBeginEl.textContent = Number.isFinite(dayStartCash)
            ? dayStartCash.toLocaleString('en-IN', { maximumFractionDigits: 0 })
            : '--';

        // Calculate net P/L for all executed trades shown in the grid.
        const netPnL = (ordersRowsCache || []).reduce((total, row) => {
            const pnl = Number(row['PnL']);
            return Number.isFinite(pnl) ? total + pnl : total;
        }, 0);

        cashCurrentEl.textContent = Number.isFinite(netPnL)
            ? netPnL.toLocaleString('en-IN', {
                maximumFractionDigits: 2,
                minimumFractionDigits: 2
            })
            : '--';

        if (Number.isFinite(netPnL) && Number.isFinite(dayStartCash) && dayStartCash > 0) {
            const pnlPct = (netPnL / dayStartCash) * 100;

            cashChangeEl.textContent = `${pnlPct.toFixed(2)}%`;
            cashChangeEl.className =
                pnlPct > 0 ? 'profit' : (pnlPct < 0 ? 'loss' : '');
        } else {
            cashChangeEl.textContent = '--';
            cashChangeEl.className = '';
        }
    }




    function scheduleOrdersRefresh() {
        if (ordersRefreshTimer) clearTimeout(ordersRefreshTimer);
        ordersRefreshTimer = setTimeout(loadOrders, 1500);
    }

    if (ordersRefreshBtn) {
        ordersRefreshBtn.addEventListener('click', loadOrders);
    }

    if (ordersDateInput) {
        ordersDateInput.addEventListener('change', loadOrders);
    }

    attachOrdersSortHandlers();

    function downloadBlobAsFile(response, fallbackName) {
        return response.blob().then(blob => {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const contentDisposition = response.headers.get('Content-Disposition') || '';
            const filenameMatch = contentDisposition.match(/filename="?([^";]+)"?/i);
            a.download = filenameMatch && filenameMatch[1] ? filenameMatch[1] : fallbackName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);
        });
    }

    async function downloadBrokerOrders() {
        const tradeDate = getSelectedTradeDate();
        const response = await fetch('/import_executed_trades', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ trade_date: tradeDate })
        });

        const contentType = response.headers.get('Content-Type') || '';
        if (contentType.includes('application/json')) {
            const data = await response.json();
            throw new Error(data.error || 'No executed trades available to download');
        }

        if (!response.ok) {
            throw new Error(`HTTP Error: ${response.status}`);
        }

        await downloadBlobAsFile(response, `Orders_${tradeDate.replace(/-/g, '_')}.xlsx`);
    }

    async function downloadUploadedOrders() {
        const tradeDate = (uploadedOrdersMeta && uploadedOrdersMeta.trade_date) || '';
        const filenameDate = tradeDate.replaceAll('-', '_');
        const fallbackName = `MStock_Orders_${filenameDate || 'ContractNote'}.xlsx`;

        const response = await fetch('/export_executed_trades', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                rows: ordersRowsCache,
                pine_script: (uploadedOrdersMeta && uploadedOrdersMeta.pine_script) || '',
                filename: filenameDate ? `MStock_Orders_${filenameDate}` : 'MStock_Orders_ContractNote'
            })
        });

        const contentType = response.headers.get('Content-Type') || '';
        if (contentType.includes('application/json')) {
            const data = await response.json();
            throw new Error(data.error || 'No trades available to download');
        }

        if (!response.ok) {
            throw new Error(`HTTP Error: ${response.status}`);
        }

        await downloadBlobAsFile(response, fallbackName);
    }

    async function downloadOrders() {
        if (ordersDownloadBtn) ordersDownloadBtn.disabled = true;
        try {
            // Download exactly what the grid is showing: uploaded
            // contract-note rows when present, else the selected date's
            // broker trades.
            if (ordersSource === 'upload' && ordersRowsCache.length > 0) {
                await downloadUploadedOrders();
            } else {
                await downloadBrokerOrders();
            }
        } catch (error) {
            console.error("Could not download trades:", error);
            alert(error.message || "Could not download trades");
        } finally {
            if (ordersDownloadBtn) ordersDownloadBtn.disabled = false;
        }
    }

    if (ordersDownloadBtn) {
        ordersDownloadBtn.addEventListener('click', downloadOrders);
    }

    async function uploadContractNote() {
        if (!ordersUploadInput || !ordersUploadInput.files || ordersUploadInput.files.length === 0) return;
        const pdfFile = ordersUploadInput.files[0];
        if (ordersUploadBtn) ordersUploadBtn.disabled = true;
        if (ordersRefreshBtn) ordersRefreshBtn.disabled = true;
        try {
            const formData = new FormData();
            formData.append("pdf", pdfFile);

            const response = await fetch('/convert_contract_note_rows', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (!response.ok || !data.success) {
                throw new Error(data.error || `HTTP Error: ${response.status}`);
            }

            ordersRowsCache = data.rows || [];
            ordersSource = 'upload';
            uploadedOrdersMeta = {
                pine_script: data.pine_script || '',
                trade_date: data.trade_date || ''
            };
            renderOrders(ordersRowsCache);
            // Uploaded data is not tied to today's live cash story.
            if (cashSummaryLabel) cashSummaryLabel.style.display = 'none';
        } catch (error) {
            console.error("Could not upload contract note:", error);
            alert(error.message || "Could not upload contract note");
        } finally {
            if (ordersUploadBtn) ordersUploadBtn.disabled = false;
            if (ordersRefreshBtn) ordersRefreshBtn.disabled = false;
            ordersUploadInput.value = '';
        }
    }

    if (ordersUploadBtn && ordersUploadInput) {
        ordersUploadBtn.addEventListener('click', () => ordersUploadInput.click());
        ordersUploadInput.addEventListener('change', uploadContractNote);
    }

    // --- SOCKET-DRIVEN AUTO REFRESH ---
    // Orders are placed on the Trade page; when a buy/sell result is
    // broadcast, debounce-refresh this grid so it stays current.
    socket.on('buy_order_result', function (result) {
        console.log('ORDERS PAGE: buy_order_result received:', result);
        scheduleOrdersRefresh();
    });

    socket.on('sell_order_result', function (result) {
        console.log('ORDERS PAGE: sell_order_result received:', result);
        scheduleOrdersRefresh();
    });

    // --- INITIAL LOAD ---
    loadOrders();
});
</script>
{% endblock %}
