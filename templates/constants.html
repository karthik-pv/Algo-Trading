{% extends "base.html" %}

{% block title %}Constants{% endblock %}

{% block head_styles %}
<style>
.main-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
}

.widget-container {
    background-color: #2c2c2c;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    border: 1px solid #444;
    width: 850px;
    max-width: 95%;
}

h2 {
    text-align: center;
    color: #66bb6a;
    margin-bottom: 1.8rem;
}

form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.double-row {
    display: flex;
    gap: 2rem;
    align-items: flex-start;
}

.form-group {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    flex: 1;
}

label {
    color: #ccc;
    font-size: 0.95rem;
    font-weight: 500;
    min-width: 180px; /* Fixed width for all labels */
}

select,
input[type="number"],
input[type="text"] {
    background-color: #1a1a1a;
    border: 1px solid #555;
    color: white;
    padding: 0.45rem 0.6rem;
    border-radius: 6px;
    font-size: 0.9rem;
    width: auto;
    min-width: 120px;
    max-width: 180px;
}

select:focus,
input:focus {
    border-color: #66bb6a;
    outline: none;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    margin-top: 1.5rem;
}

.btn {
    border: none;
    padding: 0.7rem 1.4rem;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

#saveBtn {
    background-color: #28a745;
    color: white;
}

#saveBtn:hover {
    background-color: #218838;
}

#cancelBtn {
    background-color: #c62828;
    color: white;
}

#cancelBtn:hover {
    background-color: #a12020;
}

#status {
    color: #66bb6a;
    font-weight: 500;
    min-width: 200px;
    text-align: left;
}

@media (max-width: 700px) {
    .double-row {
        flex-direction: column;
    }
    .form-group {
        flex-direction: column;
        align-items: flex-start;
    }
    label {
        min-width: unset;
    }
}
</style>
{% endblock %}

{% block content %}
<main class="main-content">
    <div class="widget-container">
        <h2>Constants Editor</h2>

        <form id="constantsForm">
            <!-- Row 1: Underlying + Broker -->
            <div class="double-row">
                <div class="form-group">
                    <label>Underlying</label>
                    <select id="UNDERLYING">
                        <option>NIFTY</option><option>SENSEX</option>
                        <option>CRUDEOIL</option><option>CRUDEOILM</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Broker</label>
                    <select id="BROKER">
                        <option>MSTOCK</option><option>KITE</option>
                    </select>
                </div>
            </div>

            <!-- Row 2: Order Freeze Limits -->
            <div class="double-row">
                <div class="form-group">
                    <label>NIFTY Order Freeze Limit</label>
                    <input type="number" id="NIFTY_ORDER_FREEZE_LIMIT">
                </div>
                <div class="form-group">
                    <label>SENSEX Order Freeze Limit</label>
                    <input type="number" id="SENSEX_ORDER_FREEZE_LIMIT">
                </div>
            </div>

            <!-- Row 3: WOC Factors -->
            <div class="double-row">
                <div class="form-group">
                    <label>WOC Call Factor</label>
                    <input type="number" id="WOC_CALL_FACTOR">
                </div>
                <div class="form-group">
                    <label>WOC Put Factor</label>
                    <input type="number" id="WOC_PUT_FACTOR">
                </div>
            </div>

            <!-- Row 4: Fallback LTPs -->
            <div class="double-row">
                <div class="form-group">
                    <label>NIFTY Fallback LTP</label>
                    <input type="number" id="NIFTY_FALLBACK_LTP" step="0.01">
                </div>
                <div class="form-group">
                    <label>SENSEX Fallback LTP</label>
                    <input type="number" id="SENSEX_FALLBACK_LTP" step="0.01">
                </div>
            </div>

            <!-- Row 5b: Tiered market-protection buffer (Zerodha-style, % of LTP) -->
            <div class="double-row">
                <div class="form-group">
                    <label>Limit Margin % (LTP &lt; 10)</label>
                    <input type="number" id="LIMIT_MARGIN_PCT_LT_10" step="0.1">
                </div>
                <div class="form-group">
                    <label>Limit Margin % (10 - 100)</label>
                    <input type="number" id="LIMIT_MARGIN_PCT_10_100" step="0.1">
                </div>
            </div>
            <div class="double-row">
                <div class="form-group">
                    <label>Limit Margin % (100 - 500)</label>
                    <input type="number" id="LIMIT_MARGIN_PCT_100_500" step="0.1">
                </div>
                <div class="form-group">
                    <label>Limit Margin % (&gt; 500)</label>
                    <input type="number" id="LIMIT_MARGIN_PCT_GT_500" step="0.1">
                </div>
            </div>
            <div class="double-row">
                <div class="form-group">
                    <label>Limit Margin Min (pts)</label>
                    <input type="number" id="LIMIT_MARGIN_MIN_PTS" step="0.01">
                </div>
                <div class="form-group">
                    <label>Limit Margin Max (pts)</label>
                    <input type="number" id="LIMIT_MARGIN_MAX_PTS" step="0.01">
                </div>
            </div>

            
            <!-- Row 7: Lot Size CRUDEOIL / CRUDEOILM -->
            <div class="double-row">
                <div class="form-group">
                    <label>Lot Size CRUDEOIL</label>
                    <input type="number" id="LOT_SIZE_CRUDEOIL">
                </div>
                <div class="form-group">
                    <label>Lot Size CRUDEOILM</label>
                    <input type="number" id="LOT_SIZE_CRUDEOILM">
                </div>
            </div>

            <!-- Buttons -->
            <div class="buttons">
                <button type="button" class="btn" id="saveBtn">💾 Save</button>
                <button type="button" class="btn" id="cancelBtn">❌ Cancel</button>
                <span id="status"></span>
            </div>
        </form>
    </div>
</main>

<script>
let constants = {};

async function loadConstants() {
    const res = await fetch("/load");
    constants = await res.json();
    for (const [key, val] of Object.entries(constants)) {
        const el = document.getElementById(key);
        if (el) el.value = val;
    }
}

async function saveConstants() {
    const updated = {};
    document.querySelectorAll("#constantsForm select, #constantsForm input").forEach(el => {
        updated[el.id] = el.value;
    });
    const res = await fetch("/save", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(updated)
    });
    const data = await res.json();
    const status = document.getElementById("status");
    if (data.message) {
        status.textContent = "✅ " + data.message;
        status.style.color = "#66bb6a";
    } else {
        status.textContent = "❌ " + (data.error || "Unknown error");
        status.style.color = "#ff9800";
    }
}

document.getElementById("saveBtn").addEventListener("click", saveConstants);
document.getElementById("cancelBtn").addEventListener("click", loadConstants);
loadConstants();
</script>
{% endblock %}
