{% extends "base.html" %}

{% block title %}Trading Settings{% endblock %}

{% block head_styles %}
<style>
    .main-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
        gap: 2rem;
    }

    .widget-container {
        position: relative;
        background-color: #2c2c2c;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        border: 1px solid #444;
        width: 830x;
        max-width: 95%;
    }

    h2 {
        text-align: center;
        color: #66bb6a;
        margin-bottom: 1.5rem;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .form-group1 {
        display: flex;
        flex-direction: row;
        gap: 0.5rem;
        vertical-align: middle;
    }


    label {
        color: #ccc;
        font-size: 0.95rem;
        font-weight: 500;
    }

    input[type="text"], input[type="number"] {
        background-color: #1a1a1a;
        border: 1px solid #555;
        color: white;
        padding: 0.5rem 0.75rem;
        border-radius: 5px;
        font-size: 0.9rem;
    }

    .radio-group, .checkbox-group, .grouped-inputs {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
    }

    .radio-group label, .checkbox-group label {
        color: #ccc;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        cursor: pointer;
    }

    .grouped-inputs label {
        min-width: 80px;
        color: #ccc;
    }

    .grouped-inputs input {
        width: 100px;
        text-align: center;
    }

    .btn-container {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 1.5rem;
    }

    .btn {
        border: none;
        padding: 0.8rem 1.5rem;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .btn-save {
        background-color: #28a745;
        color: white;
    }

    .btn-save:hover {
        background-color: #218838;
    }

    .btn-cancel {
        background-color: #c62828;
        color: white;
    }

    .btn-cancel:hover {
        background-color: #a12020;
    }

    .grouped-inputs {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 1rem;
        justify-content: space-between;

        /* NEW: box styling */
        border: 1px solid #555;       /* thin border */
        border-radius: 6px;           /* slightly rounded corners */
        padding: 0.5rem 1rem;         /* inner spacing */
        background-color: #1f1f1f;    /* optional subtle background */
    }

    .grouped-inputs label {
        color: #ccc;
        min-width: 40px;        /* ensure labels align neatly */
    }

    .grouped-inputs input[type="number"] {
        width: 60px;            /* fixed width for compact layout */
        text-align: center;
    }

    .grouped-inputs select {
        background-color: #1a1a1a;
        color: white;
        border: 1px solid #555;
        border-radius: 5px;
        padding: 0.4rem 0.6rem;
        font-size: 0.9rem;
        text-align: center;
        min-width: 100px;
    }    

    .form-group-inline {
        display: flex;
        flex-wrap: wrap;        /* allow wrapping on small screens */
        gap: 1rem;
        align-items: center;
    }

    .form-group-inline label {
        margin: 0;              /* remove vertical spacing */
        min-width: 120px;       /* optional: align labels */
    }

    .form-group-inline input,
    .form-group-inline select {
        flex: 1 1 auto;         /* inputs stretch as needed */
        min-width: 100px;       /* optional minimum width */
    }    

    .form-group-inline > .form-group {
        flex: 1 1 50%; 
        min-width: 150px; /* Prevent collapse on very small screens */
    }

    @media (max-width: 600px) {
        .widget-container { padding: 1rem; }
        .grouped-inputs { flex-direction: column; align-items: flex-start; }
    }
</style>
{% endblock %}

{% block content %}
<main class="main-content">
    <div class="widget-container">
        <h2>Trading Settings</h2>
        <form id="settingsForm">

            <!-- PAPER / LIVE / SIMULATION -->
            <div class="form-group">
                <label>Mode:</label>
                <div class="radio-group">
                    <label><input type="radio" name="MODE" value="PAPER" checked> PAPER</label>
                    <label><input type="radio" name="MODE" value="LIVE"> LIVE</label>
                    <label><input type="radio" name="MODE" value="SIMULATION"> SIMULATION</label>
                    <label><input type="radio" name="MODE" value="PLAYBACK"> PLAYBACK</label>
                </div>
            </div>

            <!-- TRADINGVIEW ENTRY VALIDATION -->
            <div class="form-group">
                <label>TradingView Data Validation (CE/PE Buy Gating):</label>
                <div class="checkbox-group">
                    <label title="When ON: CE buys need 30M PVT &gt; 0 OR (5M PVT &gt; 0 AND 1m close &gt; VWAP); PE buys need 30M PVT &lt; 0 OR (5M PVT &lt; 0 AND 1m close &lt; VWAP). Otherwise CALL/PUT buttons are disabled and buys are rejected.">
                        <input type="checkbox" name="TV_DATA_Validation_REQUIRED" id="TV_DATA_Validation_REQUIRED">
                        Require TradingView validation before CE/PE buys
                    </label>
                </div>
            </div>

            <div class="form-group form-group-inline">
               <div class="form-group1" style="flex: 1;">
                    <label for="MARGIN_USAGE_PCT" >Margin usage (%)</label>
                    <input type="float" id="MARGIN_USAGE_PCT" name="MARGIN_USAGE_PCT" placeholder="Enter Margin Usage Percentage">
                </div>
            </div>

            <!-- OPTIONS CHECKBOXES -->
            <div class="form-group">
                <label>Sell Trigger (Comparison Function):</label>
                <div class="radio-group">
                    <label><input type="radio" name="COMPARISON_FUNCTION" value="PNT"> PNT</label>
                    <label><input type="radio" name="COMPARISON_FUNCTION" value="PCT"> PCT</label>
                    <label><input type="radio" name="COMPARISON_FUNCTION" value="EMA"> EMA</label>
                </div>
            </div>

           <!-- STRATEGY PROFIT FACTORS -->
            <div class="form-group">
                <label>Strategy Profit Factors</label>
                <div class="grouped-inputs">

                    <label for="PTS_PROFIT_INTRA_FACTOR">Intra</label>
                    <input type="number"
                        id="PTS_PROFIT_INTRA_FACTOR"
                        name="PTS_PROFIT_INTRA_FACTOR"
                        placeholder="Enter Intra Factor"
                        step="1" />

                    <label for="PTS_PROFIT_SCALPING_FACTOR">Scalping</label>
                    <input type="number"
                        id="PTS_PROFIT_SCALPING_FACTOR"
                        name="PTS_PROFIT_SCALPING_FACTOR"
                        placeholder="Enter Scalping Factor"
                        step="1" />

                    <label for="PTS_PROFIT_ULTRA_SCALPING_FACTOR">Ultra Scalping</label>
                    <input type="number"
                        id="PTS_PROFIT_ULTRA_SCALPING_FACTOR"
                        name="PTS_PROFIT_ULTRA_SCALPING_FACTOR"
                        placeholder="Enter Ultra Scalping Factor"
                        step="1" />

                </div>
            </div>


            <!-- PCT_BOOK_PROFIT / PCT_STOP_LOSS -->
            <div class="form-group">
                <label>Profit/Loss (%)</label>
                <div class="grouped-inputs">
                    <label for="PCT_BOOK_PROFIT">PCT_BOOK_PROFIT</label>
                    <input type="number" id="PCT_BOOK_PROFIT" name="PCT_BOOK_PROFIT" placeholder="%" />
                    <label for="PCT_STOP_LOSS">PCT_STOP_LOSS</label>
                    <input type="number" id="PCT_STOP_LOSS" name="PCT_STOP_LOSS" placeholder="%" />
                </div>
            </div>

            <!-- PTS_PROFIT / PTS_LOSS -->
            <div class="form-group">
                <label>Profit/Loss (Pts)</label>
                <div class="grouped-inputs">
                    <label for="ptsProfit">PTS_PROFIT</label>
                    <input type="number" id="PTS_PROFIT" name="PTS_PROFIT" placeholder="pts" />
                    <label for="ptsLoss">PTS_LOSS</label>
                    <input type="number" id="PTS_LOSS" name="PTS_LOSS" placeholder="pts" />
                </div>
            </div>

            <!-- ORDER TYPE EMAs -->
            <div class="form-group">
                <label>Order Type EMAs</label>
                <div class="grouped-inputs">
                    <label for="INTRA_EMA">Intra</label>
                    <select id="INTRA_EMA" name="INTRA_EMA">
                        <option value="15sEMA9">15s EMA9</option>
                        <option value="15sEMA21">15s EMA21</option>
                        <option value="1mEMA9">1m EMA9</option>
                        <option value="1mEMA21">1m EMA21</option>
                        <option value="1mEMA50">1m EMA50</option>
                        <option value="1mEMA100">1m EMA100</option>
                        <option value="1mEMA200">1m EMA200</option>
                    </select>

                    <label for="SCALPING_EMA">Scalp</label>
                    <select id="SCALPING_EMA" name="SCALPING_EMA">
                        <option value="15sEMA9">15s EMA9</option>
                        <option value="15sEMA21">15s EMA21</option>
                        <option value="1mEMA9">1m EMA9</option>
                        <option value="1mEMA21">1m EMA21</option>
                        <option value="1mEMA50">1m EMA50</option>
                        <option value="1mEMA100">1m EMA100</option>
                        <option value="1mEMA200">1m EMA200</option>
                    </select>

                    <label for="ULTRA_SCALPING_EMA">UScalp</label>
                    <select id="ULTRA_SCALPING_EMA" name="ULTRA_SCALPING_EMA">
                        <option value="15sEMA9">15s EMA9</option>
                        <option value="15sEMA21">15s EMA21</option>
                        <option value="1mEMA9">1m EMA9</option>
                        <option value="1mEMA21">1m EMA21</option>
                        <option value="1mEMA50">1m EMA50</option>
                        <option value="1mEMA100">1m EMA100</option>
                        <option value="1mEMA200">1m EMA200</option>
                    </select>
                    <label >Tolerance</label>
                    <input type="number" id="EMA_TOLERANCE_PTS" name="EMA_TOLERANCE_PTS" />

                </div>
            </div>


            <div class="btn-container">
                <button type="submit" class="btn btn-save">💾 Save</button>
                <button type="button" id="cancelBtn" class="btn btn-cancel">❌ Cancel</button>
                <span id="statusMsg" style="color:#66bb6a; font-weight:500; margin-left:1rem;"></span>
            </div>

        </form>
    </div>
</main>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const statusMsg = document.getElementById('statusMsg');

    // Load saved constants if any
    try {
        const res = await fetch('/load_settings');
        if (res.ok) {
            const data = await res.json();
            Object.entries(data).forEach(([key, value]) => {
            const el = document.querySelector(`[name="${key}"]`);
            if (!el) return;

            // ✅ Handle COMPARISON_FUNCTION array
            if (key === "COMPARISON_FUNCTION" && Array.isArray(value)) {
                const selected = value[0]; // only one allowed
                const radio = document.querySelector(
                    `[name="COMPARISON_FUNCTION"][value="${selected}"]`
                );
                if (radio) radio.checked = true;
                return;
            }

            if (el.type === 'radio') {
                const radio = document.querySelector(`[name="${key}"][value="${value}"]`);
                if (radio) radio.checked = true;
            } 
            else if (el.type === 'checkbox') {
                el.checked = !!value;
            } 
            else {
                el.value = value;
            }
        });
        }
    } catch (err) {
        console.error('Error loading settings:', err);
        statusMsg.textContent = '⚠️ Error loading settings.';
        statusMsg.style.color = '#ff9800';
    }

    // Handle Save
    document.getElementById('settingsForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        statusMsg.textContent = '💾 Saving...';
        statusMsg.style.color = '#66bb6a';

        const formData = new FormData(e.target);
        const data = {};
        
        for (const [key, value] of formData.entries()) {
            const input = e.target.querySelector(`[name="${key}"]`);

            // ✅ Force COMPARISON_FUNCTION into array
            if (key === "COMPARISON_FUNCTION") {
                data[key] = [value];
            }
            else if (input.type === 'checkbox') {
                data[key] = input.checked;
            }
            else {
                data[key] = value;
            }
        }

        // FormData omits unchecked checkboxes; add them explicitly so
        // toggling OFF is persisted too (backend merges into settings.json).
        const tvValidationToggle = document.getElementById('TV_DATA_Validation_REQUIRED');
        if (tvValidationToggle) {
            data['TV_DATA_Validation_REQUIRED'] = tvValidationToggle.checked;
        }

        try {
            const res = await fetch('/save_settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                statusMsg.textContent = '✅ Settings saved successfully!';
                statusMsg.style.color = '#66bb6a';
            } else {
                statusMsg.textContent = '⚠️ Error saving settings.';
                statusMsg.style.color = '#ff9800';
            }
        } catch (err) {
            console.error('Error saving:', err);
            statusMsg.textContent = '⚠️ Error saving settings.';
            statusMsg.style.color = '#ff9800';
        }
    });

    // Handle Cancel
    document.getElementById('cancelBtn').addEventListener('click', () => {
        statusMsg.textContent = '❌ Changes discarded.';
        statusMsg.style.color = '#c62828';
        document.getElementById('settingsForm').reset();
    });
});
</script>
{% endblock %}
