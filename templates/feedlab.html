{% extends "base.html" %}

{% block content %}
<style>
    .feedlab-wrap { max-width: 900px; margin: 0 auto; }
    .feedlab-card { background: #1e1e1e; border: 1px solid #383838; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .feedlab-card h3 { margin: 0 0 0.75rem; font-size: 1rem; color: #ddd; }
    .feedlab-row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .feedlab-btn { padding: 0.5rem 1.4rem; border-radius: 8px; border: 1px solid #4a4a4a; background: #2c2c2c; color: #eee; cursor: pointer; font-weight: 600; }
    .feedlab-btn.start { background: #274a27; border-color: #3d7a3d; }
    .feedlab-btn.stop { background: #5a2222; border-color: #8a3535; }
    .feedlab-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .feedlab-status { font-size: 0.85rem; color: #aaa; }
    .feedlab-pill { display: inline-block; padding: 0.2rem 0.7rem; border-radius: 999px; font-size: 0.78rem; font-weight: 700; }
    .feedlab-pill.on { background: #274a27; color: #9fdf9f; }
    .feedlab-pill.off { background: #4a4a4a; color: #ccc; }
    .feedlab-counts { font-variant-numeric: tabular-nums; color: #ddd; }
    .feedlab-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 0.5rem; }
    .feedlab-table th, .feedlab-table td { border: 1px solid #383838; padding: 0.4rem 0.6rem; text-align: center; }
    .feedlab-table th { background: #2a2a2a; color: #ccc; }
    .feedlab-verdict { padding: 0.75rem 1rem; border-radius: 8px; background: #222a22; color: #cfe8cf; font-weight: 600; margin: 0.75rem 0; }
    .feedlab-error { color: #ff9d9d; font-size: 0.85rem; }
    select.feedlab-select { background: #2c2c2c; color: #eee; border: 1px solid #4a4a4a; border-radius: 8px; padding: 0.45rem 0.7rem; }
</style>

<div class="feedlab-wrap">
    <section class="tab-panel active" id="panel-feedlab" data-tab="feedlab">
        <div class="feedlab-card">
            <h3>Dual-broker feed capture <span class="feedlab-pill off" id="flState">IDLE</span></h3>
            <div class="feedlab-row">
                <select class="feedlab-select" id="flUnderlying">
                    <option value="SENSEX" selected>SENSEX</option>
                    <option value="NIFTY">NIFTY</option>
                    <option value="CRUDEOILM">CRUDEOILM</option>
                </select>
                <button class="feedlab-btn start" id="flStart">Start capture</button>
                <button class="feedlab-btn stop" id="flStop" disabled>Stop</button>
                <span class="feedlab-counts" id="flCounts"></span>
            </div>
            <div class="feedlab-status" id="flStatus" style="margin-top: 0.6rem;"></div>
            <div class="feedlab-status" id="flFeedLine"></div>
            <div class="feedlab-error" id="flError"></div>
        </div>

        <div class="feedlab-card">
            <h3>Performance assessment</h3>
            <div class="feedlab-row">
                <button class="feedlab-btn" id="flReportBtn">Show performance report</button>
                <span class="feedlab-status" id="flReportHint">Report compares today's captured KITE vs M.Stock ticks.</span>
            </div>
            <div id="flReport"></div>
        </div>
    </section>
</div>

<script>
    // Hold the app's frontend socket open while this page is showing.
    // The server shuts down (os._exit) ~10s after the LAST browser
    // socket drops, and the macOS launcher watchdog kills the server
    // when nothing holds an ESTABLISHED connection to port 5001.
    // Without this, navigating Trade -> Feed Lab looks like "window
    // closed" and the app kills itself while the page is in use.
    window.__appSocket = io('http://localhost:5001', { transports: ['websocket'] });

    const flStart = document.getElementById('flStart');
    const flStop = document.getElementById('flStop');
    const flState = document.getElementById('flState');
    const flCounts = document.getElementById('flCounts');
    const flStatus = document.getElementById('flStatus');
    const flError = document.getElementById('flError');
    const flUnderlying = document.getElementById('flUnderlying');
    const flReportBtn = document.getElementById('flReportBtn');
    const flReport = document.getElementById('flReport');
    let flTimer = null;

    function flRenderStatus(s) {
        flState.textContent = s.running ? 'RUNNING' : 'IDLE';
        flState.className = 'feedlab-pill ' + (s.running ? 'on' : 'off');
        flStart.disabled = s.running;
        flStop.disabled = !s.running;
        flUnderlying.disabled = s.running;
        if (s.running) {
            flCounts.textContent = `KITE: ${s.counts.KITE.toLocaleString()} ticks   |   M.STOCK: ${s.counts.MSTOCK.toLocaleString()} ticks`;
        } else {
            flCounts.textContent = '';
        }
        if (s.session && s.session.atm_strike) {
            const inst = s.session.instruments || {};
            flStatus.innerHTML = `ATM ${s.session.atm_strike} &middot; expiry ${s.session.expiry} &middot; locked ${new Date(s.session.locked_at).toLocaleTimeString()}<br>`
                + `KITE: ${inst.KITE ? [inst.KITE.FUT, inst.KITE.CE, inst.KITE.PE].join(' / ') : '-'}<br>`
                + `M.STOCK: ${inst.MSTOCK ? [inst.MSTOCK.FUT, inst.MSTOCK.CE, inst.MSTOCK.PE].join(' / ') : '-'}`;
        } else if (s.locked_session_today) {
            flStatus.textContent = "Today's ATM session is locked - starting will reuse it.";
        } else {
            flStatus.textContent = 'Starting locks the SENSEX ATM strike for the whole day.';
        }
        if (s.net) {
            // Internet speed (neutral targets) - separate from broker API health
            const net = s.net.internet || {};
            if (net.level) {
                const targets = net.targets || {};
                const lines = Object.entries(targets).map(([u, t]) =>
                    `${u.replace('https://', '')}: ${t.last_ok ? t.last_latency_ms + 'ms' : 'FAIL'}`).join(' &middot; ');
                flStatus.innerHTML += `<br>Internet: <b style="text-transform:uppercase">${net.level}</b> &middot; ${lines}`;
            }
            // Per-broker health (the K / M pills): API + WebSocket halves
            const brokers = s.net.brokers || {};
            const brokerLines = Object.entries(brokers).map(([b, t]) => {
                const api = t.api || {}, ws = t.ws || {};
                const apiTxt = api.level ? api.level.toUpperCase() : 'IDLE';
                const apiLat = api.last_ok ? api.last_latency_ms + 'ms' : 'FAIL';
                const wsTxt = ws.level ? ws.level.toUpperCase() : 'IDLE';
                return `${b}: ${apiTxt} ${apiLat} &middot; WS ${wsTxt}`;
            }).join(' &middot; ');
            if (brokerLines) {
                flStatus.innerHTML += `<br>Broker API: ${brokerLines}`;
            }
        }
        if (s.last_error) { flError.textContent = s.last_error; }
    }

    async function flPoll() {
        try {
            const r = await fetch('/feed_compare/status');
            const s = await r.json();
            flRenderStatus(s);
            if (s.running && !flTimer) flTimer = setInterval(flPoll, 2000);
            if (!s.running && flTimer) { clearInterval(flTimer); flTimer = null; }
            const rf = await fetch('/feed_compare/feed_status');
            const f = await rf.json();
            const h = f.health || {};
            const feedLine = document.getElementById('flFeedLine');
            if (feedLine) {
                // Tick metrics (last tick / rate / longest gap) only make
                // sense while a live feed is expected - hide them in the
                // IDLE state (market closed / no socket), where stray
                // off-hours packets would only mislead.
                if (f.level === 'idle') {
                    feedLine.innerHTML = 'Feed pill: <b style="text-transform:uppercase">' + f.level + '</b>'
                        + (f.reason ? ' &middot; ' + f.reason : '');
                } else {
                    feedLine.innerHTML = 'Feed pill: <b style="text-transform:uppercase">' + f.level + '</b>'
                        + (f.reason ? ' &middot; ' + f.reason : '')
                        + (h.seconds_since_tick != null ? ' &middot; last tick ' + h.seconds_since_tick + 's ago' : '')
                        + (h.rate_per_min ? ' &middot; ' + h.rate_per_min + '/min' : '')
                        + (h.max_gap_s != null ? ' &middot; longest gap ' + h.max_gap_s + 's' : '');
                }
            }
        } catch (e) { /* server busy; retry next tick */ }
    }

    flStart.addEventListener('click', async () => {
        flError.textContent = '';
        const r = await fetch('/feed_compare/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ underlying: flUnderlying.value })
        });
        const j = await r.json();
        if (!j.ok) flError.textContent = j.error || 'Start failed';
        flPoll();
        if (j.ok && !flTimer) flTimer = setInterval(flPoll, 2000);
    });

    flStop.addEventListener('click', async () => {
        flError.textContent = '';
        await fetch('/feed_compare/stop', { method: 'POST' });
        flPoll();
    });

    flReportBtn.addEventListener('click', async () => {
        flReport.innerHTML = '<div class="feedlab-status">Building report...</div>';
        try {
            const r = await fetch('/feed_compare/report');
            const rep = await r.json();
            if (!rep.ok) { flReport.innerHTML = `<div class="feedlab-error">${rep.error}</div>`; return; }
            let html = `<div class="feedlab-verdict">${rep.verdict}</div>`;
            html += `<div class="feedlab-status">Captured ${rep.day} &middot; ${rep.underlying} ATM ${rep.atm_strike} ${rep.expiry}</div>`;
            if (rep.market_window || rep.app_restarts) {
                const r = rep.app_restarts || {};
                const rTxt = (r.total == null) ? 'n/a' : `${r.market_hours ?? r.total} in market hours (${r.total} today)`;
                html += `<div class="feedlab-status">Analysis window ${rep.market_window || '-'} &middot; app restarts: ${rTxt} &middot; internet down: ${rep.internet_down_min ?? '-'} min</div>`;
                const ra = rep.rest_anomalies;
                if (ra && (ra.KITE || ra.MSTOCK || ra.internet_explained)) {
                    html += `<div class="feedlab-status">Broker REST anomalies (internet up): KITE ${ra.KITE} &middot; MSTOCK ${ra.MSTOCK} &middot; internet-explained: ${ra.internet_explained}</div>`;
                }
            }
            for (const [broker, stats] of Object.entries(rep.per_broker)) {
                html += `<h4 style="color:#bbb;margin:0.8rem 0 0.2rem">${broker} - ${stats.ticks.toLocaleString()} ticks in ${stats.span_min} min (${stats.ticks_per_min}/min), longest silence ${stats.max_gap_s}s, stalls ${stats.stalls}</h4>`;
                html += '<table class="feedlab-table"><tr><th>Instrument</th><th>Ticks</th><th>p50 gap</th><th>p95 gap</th><th>p99 gap</th><th>Max gap</th><th>Stalls &gt;5s</th><th>Silent sec %</th></tr>';
                for (const [sym, v] of Object.entries(stats.instruments || {})) {
                    html += `<tr><td>${sym}</td><td>${v.ticks}</td><td>${v.p50_gap_ms}ms</td><td>${v.p95_gap_ms}ms</td><td>${v.p99_gap_ms}ms</td><td>${v.max_gap_s}s</td><td>${v.stalls_gt_5s}</td><td>${v.silent_seconds_pct}%</td></tr>`;
                }
                html += '</table>';
            }
            if (rep.agreement && Object.keys(rep.agreement).length) {
                html += '<h4 style="color:#bbb;margin:0.8rem 0 0.2rem">Price agreement (per-second medians)</h4>';
                html += '<table class="feedlab-table"><tr><th>Instrument</th><th>Aligned sec</th><th>Median |delta|</th><th>Max |delta|</th><th>Equal %</th></tr>';
                for (const [sym, v] of Object.entries(rep.agreement)) {
                    if (sym.startsWith('max_')) continue;
                    html += `<tr><td>${sym}</td><td>${v.aligned_seconds}</td><td>${v.median_abs_delta}</td><td>${v.max_abs_delta}</td><td>${v.equal_pct}%</td></tr>`;
                }
                html += '</table>';
            }
            if (rep.leader) {
                const l = rep.leader;
                html += `<h4 style="color:#bbb;margin:0.8rem 0 0.2rem">Who printed moves first</h4>`;
                html += `<div class="feedlab-status">KITE first: ${l.KITE_first} &middot; M.STOCK first: ${l.MSTOCK_first} &middot; tied: ${l.tie} &middot; median lead when simultaneous: ${l.median_lead_ms == null ? '-' : l.median_lead_ms + 'ms'}</div>`;
            }
            flReport.innerHTML = html;
        } catch (e) {
            flReport.innerHTML = `<div class="feedlab-error">Report failed: ${e}</div>`;
        }
    });

    flPoll();
</script>
{% endblock %}
