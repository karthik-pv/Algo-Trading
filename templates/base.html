<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The title will be set by each individual page -->
    <title>{% block title %}{% endblock %}</title>
    <!-- Socket.IO library is included here so all pages can use it -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        /* --- UNIVERSAL STYLES FOR ALL PAGES --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            height: 100vh;
            overflow-x: hidden; /* Prevent horizontal scroll */
        }

        /* --- STYLES FOR THE SHARED NAVBAR COMPONENT --- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0.5rem 0;
            z-index: 1001;
        }
        .menu-button {
            background: none; border: none; cursor: pointer; padding: 15px;
            display: flex; flex-direction: column; justify-content: space-around;
            width: 44px; height: 44px; margin-left: 1.5rem; box-sizing: border-box;
        }
        .menu-button span {
            width: 100%; height: 3px; background-color: white; border-radius: 2px;
            transition: all 0.3s ease-in-out;
        }
        .sidebar {
            position: fixed; top: 0; left: 0; height: 100%; width: 280px;
            background-color: #2c2c2c; border-right: 1px solid #444;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.5); padding-top: 5rem;
            transform: translateX(-100%); transition: transform 0.3s ease-in-out; z-index: 1000;
        }
        .sidebar.active { transform: translateX(0); }
        .sidebar ul { list-style: none; padding: 0; margin: 0; }
        .sidebar a {
            display: block; padding: 1rem 1.5rem; color: #e0e0e0; text-decoration: none;
            font-size: 1.1rem; border-bottom: 1px solid #383838; transition: background-color 0.2s;
        }
        .sidebar a:hover { background-color: #444; }
        .overlay {
            position: fixed; top: 0; left: 0; height: 100%; width: 100%;
            background-color: rgba(0, 0, 0, 0.7); z-index: 999;
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }
        .overlay.active { opacity: 1; visibility: visible; }
    </style>
    <!-- Placeholder for any page-specific styles -->
    {% block head_styles %}{% endblock %}
</head>
<body>

    <!-- === SHARED NAVIGATION COMPONENT (Present on all pages) === -->
    <div class="header">
        <button class="menu-button" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
    <nav class="sidebar" id="mainSidebar">
        <ul>
            <li><a href="/home">Home</a></li>
            <li><a href="/widget_two">Options Widget</a></li>
            <!-- Add other links here -->
        </ul>
    </nav>
    <div class="overlay" id="overlay"></div>
    <!-- === END OF SHARED COMPONENT === -->

    <!-- === PAGE-SPECIFIC CONTENT WILL BE INJECTED HERE === -->
    {% block content %}{% endblock %}
    <!-- === END OF PAGE-SPECIFIC CONTENT === -->

    <!-- Universal JavaScript for the sidebar -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.getElementById('menuToggle');
            const mainSidebar = document.getElementById('mainSidebar');
            const overlay = document.getElementById('overlay');

            function toggleMenu() {
                mainSidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            }
            menuToggle.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        });
    </script>

    <!-- Placeholder for any page-specific scripts -->
    {% block scripts %}{% endblock %}

</body>
</html>
