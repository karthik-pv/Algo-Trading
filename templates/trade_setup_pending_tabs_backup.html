<!-- ================= 5. JS: pending orders handler + cancel listeners + module-tab switching (removed) ================= -->
<script>
    const pendingOrdersBody = document.getElementById('pendingOrdersBody');

    // Receive list of pending orders from backend
    socket.on('update_pending_orders', function(orders) {
        pendingOrdersBody.innerHTML = "";

        if (!orders || orders.length === 0) {
            pendingOrdersBody.innerHTML =
                `<tr><td colspan="5" style="text-align:center; color:#888;">No pending orders</td></tr>`;
            return;
        }

        orders.forEach(order => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${order.tradingsymbol}</td>
                <td>${order.quantity}</td>
                <td>${order.order_id}</td>
                <td>${order.average_price}</td>
                <td>
                    <button class="sell-button cancel-btn" 
                            data-orderid="${order.order_id}">
                        Cancel
                    </button>
                </td>
            `;
            pendingOrdersBody.appendChild(row);
        });

        addCancelOrderListeners();
    });

    function addCancelOrderListeners() {
    document.querySelectorAll('.cancel-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const orderId = this.dataset.orderid;
            socket.emit('cancel_pending_order', { order_id: orderId });
        });
    });
}

    // --- MODULE TABS (Trade / Setup / Pending Orders) ---
    const dashboardTabButtons = document.querySelectorAll('.dashboard-tab');
    const dashboardTabPanels = document.querySelectorAll('.dashboard-tab-panel');

    function activateTab(tabButton) {
        dashboardTabButtons.forEach(btn => btn.classList.toggle('active', btn === tabButton));
        const targetPanelId = tabButton.dataset.tab;
        dashboardTabPanels.forEach(panel => panel.classList.toggle('active', panel.id === targetPanelId));
    }

    dashboardTabButtons.forEach(btn => btn.addEventListener('click', () => activateTab(btn)));
</script>

<!-- ================= 7. JS: full update_trading_view_data handler (the live one now only runs TV validation) ================= -->
<script>
    socket.on('update_trading_view_data', (payload) => {
        console.log("Received TradingView data:", payload);

        const data = payload.TradingView_Data || {};
        const tradeSetups = payload.TradeSetups || [];

        // TradingView entry validation flags (TV_DATA_Validation_REQUIRED).
        // Must run before any early return below so button state always
        // tracks the latest webhook.
        applyTVValidationPayload(payload);

        // --- DEBUG ---
        console.log("TradeSetups received:", tradeSetups);

        // --- Paint the Trade Setups Table ---
        const container = document.getElementById("tradeSetupsContainer");
        if (!container) {
            console.warn("Missing #tradeSetupsContainer element in DOM");
            return;
        }

        // Clear old content
        container.innerHTML = "";

        if (!Array.isArray(tradeSetups) || tradeSetups.length === 0) {
            container.innerHTML = `<p style="color:gray;">No trade setups available.</p>`;
            return;
        }

        // Build table
        const table = document.createElement("table");
        table.classList.add("trade-table");

        // Table Header
        table.innerHTML = `
            <thead>
                <tr>
                    <th>Trend</th>
                    <th>SetUp</th>
                    <th>Description</th>
                    <th>Trade Case</th>
                </tr>
            </thead>
            <tbody></tbody>
        `;

        const tbody = table.querySelector("tbody");

        tradeSetups.forEach((setup) => {
            const row = document.createElement("tr");

            // Color rows based on trend
            if (setup.Trend === "Uptrend") row.classList.add("trend-up");
            else if (setup.Trend === "Downtrend") row.classList.add("trend-down");
            else row.classList.add("trend-neutral");

            // Flash/bold if aggressive
            if (setup.Aggressive) row.classList.add("aggressive");

            row.innerHTML = `
                <td>${setup.Trend}</td>
                <td>${setup.SetUp}</td>
                <td>${setup.Description}</td>
                <td>${setup.TradeCase}</td>
            `;

            tbody.appendChild(row);
        });

        container.appendChild(table);
    });
</script>
