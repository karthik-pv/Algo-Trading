{% extends "base.html" %}

{% block title %}Utilities{% endblock %}

{% block head_styles %}
<style>
.main-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
}

.widget-container {
    background-color: #2c2c2c;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    border: 1px solid #444;
    width: 500px;
    max-width: 95%;
}

h2 {
    text-align: center;
    color: #66bb6a;
    margin-bottom: 1.8rem;
}

.form-group {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.2rem;
}

label {
    color: #ccc;
    font-size: 1rem;
    font-weight: 500;
    min-width: 150px;
}

input[type="date"] {
    background-color: #1a1a1a;
    border: 1px solid #555;
    color: white;
    padding: 0.55rem 0.75rem;
    border-radius: 6px;
    font-size: 0.95rem;
    width: 170px;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    margin-top: 1.5rem;
}

.btn {
    border: none;
    padding: 0.7rem 1.4rem;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

#importBtn {
    background-color: #28a745;
    color: white;
}

#importBtn:hover {
    background-color: #218838;
}

#status {
    margin-top: 1rem;
    text-align: center;
    font-size: 1rem;
    font-weight: 500;
}
select {
    background-color: #1a1a1a;
    border: 1px solid #555;
    color: white;
    padding: 0.55rem 0.75rem;
    border-radius: 6px;
    font-size: 0.95rem;
    width: 180px;
}
</style>
{% endblock %}

{% block content %}
<main class="main-content">
    <div class="widget-container">
        <h2>Import Executed Trades</h2>
        <div class="form-group">
            <label>Trade Date</label>
            <input type="date" id="tradeDate">
        </div>
        <div class="buttons">
            <button id="importBtn" class="btn">📥 Import Executed Trades</button>
        </div>

        <hr style="margin: 1.5rem 0; border-color:#444;">

        <h2>Contract Note → CSV</h2>
        <div class="form-group">
            <label>Select PDF</label>
            <input type="file" id="pdfFile" accept="application/pdf">
        </div>
        <div class="buttons">
            <button id="convertPdfBtn" class="btn">📄 Convert to CSV</button>
        </div>

        <hr style="margin: 1.5rem 0; border-color:#444;">

        <div id="status"></div>
        <div class="form-group">
            <label>SELL Mode</label>
            <select id="sellMode">
                <option value="ALERT">ALERT</option>
                <option value="BUY_SELL">BUY_SELL</option>
                <option value="BUY_PRICE_SELL">BUY_PRICE_SELL</option>
            </select>
        </div>
        <div class="buttons"></div>
            <button id="updateModeBtn" class="btn">🔄 Update Mode</button>
        </div>
    </div>
</div>
</main>

<script>
    async function importExecutedTrades() {
        const status = document.getElementById("status");
        const dateValue = document.getElementById("tradeDate").value;

        status.textContent = "";
        status.style.color = "#ccc";

        if (!dateValue) {
            status.textContent = "❌ Please select a trade date";
            status.style.color = "#ff5252";
            return;
        }

        status.textContent = "⏳ Processing...";
        status.style.color = "#ffcc00";

        try {
            const res = await fetch("/import_executed_trades_kite", {
            //const res = await fetch("/import_executed_trades", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ trade_date: dateValue })
            });

            const data = await res.json();

            if (data.success) {
                status.textContent = "✅ " + data.message;
                status.style.color = "#66bb6a";
            } else {
                status.textContent = "❌ " + data.error;
                status.style.color = "#ff5252";
            }

        } catch (err) {
            status.textContent = "❌ Network error";
            status.style.color = "#ff5252";
        }
    }

    document.getElementById("importBtn")
            .addEventListener("click", importExecutedTrades);
</script>

<script>
async function updateSellMode() {
    const mode = document.getElementById("sellMode").value;
    const status = document.getElementById("status");

    status.textContent = "⏳ Updating mode...";
    status.style.color = "#ffcc00";

    try {
        const res = await fetch("/update_sell_mode", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mode: mode })
        });

        const data = await res.json();

        if (data.success) {
            status.textContent = "✅ Mode updated to " + mode;
            status.style.color = "#66bb6a";
        } else {
            status.textContent = "❌ " + data.error;
            status.style.color = "#ff5252";
        }
    } catch (err) {
        status.textContent = "❌ Network error";
        status.style.color = "#ff5252";
    }
}

document.getElementById("updateModeBtn")
        .addEventListener("click", updateSellMode);
</script>

<script>
async function convertPdfToCsv() {
    const status = document.getElementById("status");
    const fileInput = document.getElementById("pdfFile");

    status.textContent = "";
    status.style.color = "#ccc";

    if (!fileInput.files.length) {
        status.textContent = "❌ Please select a PDF file";
        status.style.color = "#ff5252";
        return;
    }

    const formData = new FormData();
    formData.append("pdf", fileInput.files[0]);

    status.textContent = "⏳ Converting PDF to CSV...";
    status.style.color = "#ffcc00";

    try {
        const res = await fetch("/convert_contract_note", {
            method: "POST",
            body: formData
        });

        if (!res.ok) {
            throw new Error("Conversion failed");
        }

        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "contract_trades.csv";
        document.body.appendChild(a);
        a.click();
        a.remove();

        status.textContent = "✅ CSV downloaded successfully";
        status.style.color = "#66bb6a";

    } catch (err) {
        status.textContent = "❌ Error converting PDF";
        status.style.color = "#ff5252";
    }
}

document.getElementById("convertPdfBtn")
        .addEventListener("click", convertPdfToCsv);
</script>



    {% endblock %}
